<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-5" style="max-width: 480px;">
    <h1 class="mb-4">Crear cuenta</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>



    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" th:field="*{nombre}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
    </form>
    <p class="mt-3 text-center">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresá</a>.</p>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
