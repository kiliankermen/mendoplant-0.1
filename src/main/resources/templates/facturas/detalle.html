<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Factura ' + ${factura.numero})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
    <div class="d-flex justify-content-between mb-3 print-hide">
        <a th:href="@{/ordenes/{id}(id=${orden.id})}" class="btn btn-outline-success">
            <i class="bi bi-arrow-left me-1"></i>Volver a la orden</a>
        <button class="btn btn-secondary" onclick="window.print()">
            <i class="bi bi-printer me-1"></i>Imprimir</button>
    </div>

    <div class="card mx-auto" style="max-width: 820px;" id="factura">
        <div class="card-body p-4">
            <!-- Cabecera -->
            <div class="d-flex justify-content-between align-items-start border-bottom pb-3">
                <div>
                    <div class="fs-4 fw-bold text-success">🌿 Plant Finder</div>
                    <div class="small text-muted" th:text="${factura.razonSocial}">Razón social</div>
                    <div class="small" th:text="${factura.domicilioEmisor}">Domicilio</div>
                    <div class="small" th:text="'CUIT: ' + ${factura.cuitEmisor ?: '(CUIT pendiente de carga)'}">CUIT</div>
                    <div class="small" th:text="'Condición fiscal: ' + ${factura.condicionFiscalEmisor}">Condición</div>
                </div>
                <div class="text-end">
                    <div class="fw-bold">FACTURA</div>
                    <div th:text="'Letra ' + ${factura.letra}">Letra C</div>
                    <div class="fs-4" th:text="${factura.numero}">00001-00000001</div>
                    <div class="small" th:text="'Punto de venta: ' + ${factura.puntoVenta}">Punto de venta</div>
                </div>
            </div>

            <!-- Datos -->
            <div class="row mt-3 mb-3 g-3">
                <div class="col-md-6">
                    <strong class="small text-muted">COMPROBANTE</strong>
                    <div class="small">
                        N°: <strong th:text="${factura.numero}"></strong><br/>
                        Letra: <span th:text="${factura.letra}"></span><br/>
                        Fecha de emisión: <span th:text="${#temporals.format(factura.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span><br/>
                        Orden de compra: #<span th:text="${orden.id}"></span>
                    </div>
                </div>
                <div class="col-md-6">
                    <strong class="small text-muted">RECEPTOR</strong>
                    <div class="small">
                        <div th:text="${factura.nombreReceptor}">Nombre</div>
                        <div th:text="${factura.documentoReceptor}">Consumidor Final</div>
                    </div>
                </div>
            </div>

            <!-- Items -->
            <table class="table table-sm table-bordered">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th class="text-center" style="width:80px">Cant.</th>
                    <th class="text-end" style="width:130px">Precio unit.</th>
                    <th class="text-end" style="width:130px">Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${orden.items}">
                    <td th:text="${item.plant.nombreComun}">Planta</td>
                    <td class="text-center" th:text="${item.cantidad}"></td>
                    <td class="text-end" th:text="'$' + ${item.precioUnitario}"></td>
                    <td class="text-end" th:text="'$' + ${item.getSubtotal()}"></td>
                </tr>
                </tbody>
            </table>

            <!-- Totales -->
            <div class="row">
                <div class="col-md-5 offset-md-7">
                    <table class="table table-sm mb-0">
                        <tr>
                            <td>Subtotal</td>
                            <td class="text-end" th:text="'$' + ${factura.subtotal}"></td>
                        </tr>
                        <tr>
                            <td>IVA (21%)</td>
                            <td class="text-end" th:text="'$' + ${factura.iva}"></td>
                        </tr>
                        <tr class="fw-bold">
                            <td>TOTAL</td>
                            <td class="text-end" th:text="'$' + ${factura.total}"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <div class="small text-muted mt-3 pt-3 border-top" th:if="${factura.estado == 'ANULADA'}">
                <span class="text-danger fw-bold">COMPROBANTE ANULADO</span>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<style>
    @media print {
        .mp-header, .mp-footer, .print-hide { display: none !important; }
        body { background: #fff; }
    }
</style>
</body>
</html>
