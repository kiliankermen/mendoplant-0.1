<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicion} ? 'Editar artículo' : 'Nuevo artículo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4" style="max-width: 640px;">
    <h1 class="mb-4" th:text="${modoEdicion} ? 'Editar artículo' : 'Nuevo artículo'"></h1>
    <form th:action="${modoEdicion} ? @{/admin/blog/editar/{id}(id=${postDto.id})} : @{/admin/blog/nueva}"
          th:object="${postDto}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" th:field="*{titulo}" class="form-control"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" th:field="*{categoria}" class="form-control" placeholder="Consejos, Guías, Novedades..."/>
        </div>
        <div class="mb-3">
            <label class="form-label">Contenido</label>
            <textarea th:field="*{contenido}" class="form-control" rows="8"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}"></div>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
