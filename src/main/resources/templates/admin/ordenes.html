<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Pedidos</h1>
        <a th:href="@{/admin}" class="btn btn-outline-success">Volver al panel</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Fecha</th>
                <th>Comprador</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Envío</th>
                <th>Pago</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="'#' + ${o.id}"></td>
                <td th:text="${#temporals.format(o.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span th:text="${o.comprador.nombre}">Nombre</span><br/>
                    <span class="small text-muted" th:text="${o.comprador.email}">email</span>
                </td>
                <td th:text="'$' + ${o.total}"></td>
                <td>
                    <span th:if="${o.estado.name() == 'COMPLETADO'}" class="badge bg-success" th:text="${o.estado}"></span>
                    <span th:if="${o.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark" th:text="${o.estado}"></span>
                    <span th:if="${o.estado.name() == 'CANCELADO'}" class="badge bg-danger" th:text="${o.estado}"></span>
                </td>
                <td>
                    <span th:if="${o.envio != null}" th:text="${o.envio.estado}">PENDIENTE</span>
                    <span th:if="${o.envio == null}" class="text-muted">—</span>
                </td>
                <td class="small">
                    <span th:text="${o.paymentStatus ?: '—'}"></span>
                </td>
                <td>
                    <a th:href="@{/admin/ordenes/{id}(id=${o.id})}" class="btn btn-sm btn-outline-success">Ver</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(ordenes)}" class="text-muted">Todavía no hay pedidos.</p>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
