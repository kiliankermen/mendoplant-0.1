<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
    <h1 class="mb-4">Usuarios</h1>
    <table class="table table-striped align-middle">
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>
            <td>
                <span class="badge bg-success" th:if="${u.estado}">Activo</span>
                <span class="badge bg-secondary" th:unless="${u.estado}">Deshabilitado</span>
            </td>
            <td class="d-flex gap-2">
                <form th:action="@{/admin/usuarios/{id}/rol(id=${u.id})}" method="post" class="d-flex gap-1">
                    <select name="rol" class="form-select form-select-sm">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r} == ${u.role}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Cambiar</button>
                </form>
                <form th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post">
                    <input type="hidden" name="activo" th:value="${!u.estado}"/>
                    <button type="submit" class="btn btn-sm btn-outline-warning"
                            th:text="${u.estado} ? 'Deshabilitar' : 'Habilitar'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
