<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Blog')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
    <h1 class="mb-4">Blog Mendo Plant</h1>
    <div class="row g-4">
        <div class="col-md-4" th:each="post : ${posts}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge badge-luz mb-2" th:text="${post.categoria}"></span>
                    <h5 class="card-title" th:text="${post.titulo}"></h5>
                    <p class="text-muted small" th:text="${#temporals.format(post.fecha, 'dd/MM/yyyy')}"></p>
                    <a th:href="@{/blog/{slug}(slug=${post.slug})}" class="btn btn-outline-success btn-sm">Leer más</a>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(posts)}" class="text-muted">Todavía no hay publicaciones.</p>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
