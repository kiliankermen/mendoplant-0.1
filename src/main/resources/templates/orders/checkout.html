<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirmar compra')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4" style="max-width: 820px;">
    <h1 class="mb-2">Confirmar compra</h1>
    <p class="text-muted">Completá los datos de entrega y continua&aacute; al pago.</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="${accion}" method="post" th:object="${envioDto}" id="checkoutForm"
          data-subtotal="0">
        <div class="row g-4">
            <!-- Columna: productos -->
            <div class="col-lg-7">
                <div class="card mb-3" th:if="${modo == 'directa'}">
                    <div class="card-body">
                        <div class="d-flex gap-3 align-items-center">
                            <img th:src="${@imageStorageService.imagenPlanta(planta.id, planta.imagenUrl)}"
                                 alt="" style="width:90px;height:90px;object-fit:cover;border-radius:.5rem;"
                                 onerror="this.onerror=null; this.src='/images/placeholder-planta.svg'"/>
                            <div class="flex-grow-1">
                                <h5 th:text="${planta.nombreComun}">Planta</h5>
                                <div class="text-muted small" th:text="${planta.nombreCientifico}">Científico</div>
                                <div th:with="pct=${@promocionService.porcentajeDescuentoVisible(planta)}">
                                    <div th:if="${pct > 0}" class="text-success small"
                                         th:text="'-' + ${pct} + '% de descuento aplicado'">-30% de descuento aplicado</div>
                                </div>
                            </div>
                            <div class="text-end">
                                <div class="fw-bold" th:text="'$' + ${@promocionService.precioConDescuento(planta)}">$0</div>
                                <label class="form-label small mb-0">Cantidad</label>
                                <input type="number" name="cantidad" min="1" value="1" style="width:80px"
                                       th:max="${planta.stock}" class="form-control form-control-sm" required/>
                            </div>
                        </div>
                        <div class="small text-muted mt-2" th:text="'Stock disponible: ' + ${planta.stock}"></div>
                    </div>
                </div>

                <div class="card mb-3" th:if="${modo == 'carrito'}" th:with="subtotal=${subtotal}">
                    <div class="card-body">
                        <h5 class="mb-3">Tu carrito</h5>
                        <div th:each="item, st : ${items}" class="d-flex gap-3 align-items-center mb-2">
                            <img th:src="${@imageStorageService.imagenPlanta(item.plantId, item.imagenUrl)}"
                                 alt="" style="width:60px;height:60px;object-fit:cover;border-radius:.5rem;"
                                 onerror="this.onerror=null; this.src='/images/placeholder-planta.svg'"/>
                            <div class="flex-grow-1">
                                <strong th:text="${item.nombre}">Planta</strong>
                                <div class="small text-muted" th:text="'$' + ${item.precioMostrado} + ' × ' + ${item.cantidad}"></div>
                            </div>
                            <span class="fw-bold" th:text="'$' + ${item.subtotal}">$0</span>
                        </div>
                        <hr/>
                        <div class="d-flex justify-content-between">
                            <span>Subtotal productos</span>
                            <strong class="mp-subtotal-src" th:text="'$' + ${subtotal}">$0</strong>
                        </div>
                    </div>
                </div>

                <!-- Datos de envío -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="bi bi-truck me-2"></i>Datos de entrega</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Quién recibe *</label>
                                <input class="form-control" th:field="*{receptorNombre}" placeholder="Nombre y apellido"/>
                                <small class="text-danger" th:if="${#fields.hasErrors('receptorNombre')}" th:errors="*{receptorNombre}"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input class="form-control" th:field="*{telefono}" placeholder="Ej: 261 555 1234"/>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Calle y número *</label>
                                <input class="form-control" th:field="*{calleNumero}" placeholder="Av. San Martín 123"/>
                                <small class="text-danger" th:if="${#fields.hasErrors('calleNumero')}" th:errors="*{calleNumero}"></small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Depto / Piso</label>
                                <input class="form-control" th:field="*{depto}" placeholder="Opcional"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ciudad *</label>
                                <input class="form-control" th:field="*{ciudad}" placeholder="Ciudad"/>
                                <small class="text-danger" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Código postal</label>
                                <input class="form-control" th:field="*{codigoPostal}" placeholder="M5500"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Provincia *</label>
                                <select class="form-select" th:field="*{provincia}" id="provincia">
                                    <option value="">Seleccioná tu provincia</option>
                                    <option th:each="p : ${provincias}" th:value="${p}" th:text="${p}"></option>
                                </select>
                                <small class="text-danger" th:if="${#fields.hasErrors('provincia')}" th:errors="*{provincia}"></small>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Instrucciones de entrega</label>
                                <textarea class="form-control" th:field="*{instrucciones}" rows="2"
                                          placeholder="Opcional: indicá referencias del domicilio..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna: resumen -->
            <div class="col-lg-5">
                <div class="card sticky-lg-top" style="top:1rem;">
                    <div class="card-body">
                        <h5 class="mb-3">Resumen</h5>
                        <div class="d-flex justify-content-between mb-1">
                            <span th:text="${modo == 'directa'} ? 'Producto' : 'Productos'">Productos</span>
                            <span id="resumenSubtotal" th:text="'$' + ${modo == 'directa' ? @promocionService.precioConDescuento(planta) : subtotal}">$0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Envío</span>
                            <span id="resumenEnvio">$0</span>
                        </div>
                        <hr/>
                        <div class="d-flex justify-content-between fs-5 fw-bold">
                            <span>Total</span>
                            <span id="resumenTotal">$0</span>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-3">Pagar con Mercado Pago</button>
                        <p class="small text-muted mt-2 mb-0">
                            <i class="bi bi-shield-check me-1"></i>Pago procesado de forma segura por Mercado Pago.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script th:inline="javascript">
    (function () {
        var contextPath = /*[[@{/}]]*/ '/';
        var form = document.getElementById('checkoutForm');
        var selectProv = document.getElementById('provincia');

        // Subtotal a mostrar según el modo.
        var subtotal = 0;
        <th:block th:if="${modo == 'directa'}">
            subtotal = Number(/*[[${@promocionService.precioConDescuento(planta)}]]*/ 0);
        </th:block>
        <th:block th:if="${modo == 'carrito'}">
            subtotal = Number(/*[[${subtotal}]]*/ 0);
        </th:block>

        var mostrarCostoSeleccionado = selectProv.value;
        if (mostrarCostoSeleccionado) {
            recalcular();
        }

        selectProv.addEventListener('change', recalcular);

        function recalcular() {
            var prov = selectProv.value;
            if (!prov) {
                aplicar(0);
                return;
            }
            var url = contextPath + 'ordenes/costo-envio?provincia=' + encodeURIComponent(prov)
                    + '&subtotal=' + encodeURIComponent(subtotal);
            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (json) { aplicar(Number(json.costo)); })
                .catch(function () { aplicar(0); });
        }

        function aplicar(envio) {
            document.getElementById('resumenEnvio').textContent = '$' + envio;
            document.getElementById('resumenTotal').textContent = '$' + (subtotal + envio);
        }
    })();
</script>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
