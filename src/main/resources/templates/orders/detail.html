<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Orden #' + ${orden.id})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4" style="max-width: 820px;">
    <div class="alert alert-success" th:if="${param.exito}">¡Compra realizada con éxito!</div>
    <div class="alert alert-success" th:if="${mensajePago}" th:text="${mensajePago}"></div>

    <h1 class="mb-4">Orden #<span th:text="${orden.id}"></span></h1>

    <div class="mb-3">
        <strong>Estado:</strong>
        <span th:if="${orden.estado.name() == 'COMPLETADO'}" class="badge bg-success" th:text="${orden.estado}"></span>
        <span th:if="${orden.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark" th:text="${orden.estado}"></span>
        <span th:if="${orden.estado.name() == 'CANCELADO'}" class="badge bg-danger" th:text="${orden.estado}"></span>
        <span class="text-muted" th:if="${orden.paymentStatus}" th:text="' · MP: ' + ${orden.paymentStatus}"></span>
    </div>

    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(orden.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>

    <table class="table">
        <thead><tr><th>Planta</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
        <tbody>
        <tr th:each="item : ${orden.items}">
            <td th:text="${item.plant.nombreComun}"></td>
            <td th:text="${item.cantidad}"></td>
            <td th:text="'$' + ${item.precioUnitario}"></td>
            <td th:text="'$' + ${item.getSubtotal()}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Envío -->
    <div class="card mb-3" th:if="${envio != null}">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-truck me-2"></i>Envío</span>
            <span>
                <span th:if="${envio.estado.name() == 'ENTREGADO'}" class="badge bg-success" th:text="${envio.estado}"></span>
                <span th:if="${envio.estado.name() == 'ENVIADO' or envio.estado.name() == 'PREPARADO'}" class="badge bg-info text-dark" th:text="${envio.estado}"></span>
                <span th:if="${envio.estado.name() == 'PENDIENTE'}" class="badge bg-secondary" th:text="${envio.estado}"></span>
                <span th:if="${envio.estado.name() == 'CANCELADO'}" class="badge bg-danger" th:text="${envio.estado}"></span>
            </span>
        </div>
        <div class="card-body">
            <p class="mb-1">
                <strong th:text="${envio.receptorNombre}">Nombre</strong> · <span th:text="${envio.calleNumero}">Calle</span>
                <span th:if="${envio.depto}" th:text="', ' + ${envio.depto}"></span><br/>
                <span th:text="${envio.ciudad} + ', ' + ${envio.provincia}"></span>
                <span th:if="${envio.codigoPostal}" th:text="' · CP ' + ${envio.codigoPostal}"></span>
            </p>
            <p class="mb-1 small text-muted">
                Costo de envío: <strong th:text="'$' + ${envio.costo}"></strong>
                <span th:if="${envio.transportista}" th:text="' · ' + ${envio.transportista}"></span>
                <span th:if="${envio.tracking}" th:text="' · Tracking: ' + ${envio.tracking}"></span>
            </p>
        </div>
    </div>

    <h4 class="text-end">Total: $<span th:text="${orden.total}"></span></h4>

    <div class="mt-3" th:if="${factura != null and factura.estado == 'FACTURADA'}">
        <a th:href="@{/facturas/{id}(id=${factura.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-receipt me-1"></i>Ver factura</a>
    </div>

    <div class="d-flex gap-2 mt-4" th:if="${orden.estado.name() == 'PENDIENTE'}">
        <form th:action="@{/ordenes/{id}/reintentar(id=${orden.id})}" method="post">
            <button class="btn btn-success">Reintentar pago</button>
        </form>
        <form th:action="@{/ordenes/{id}/verificar(id=${orden.id})}" method="post">
            <button class="btn btn-outline-success">Verificar estado del pago</button>
        </form>
    </div>

    <div class="mt-4">
        <a th:href="@{/ordenes}" class="btn btn-outline-success">Ver mi historial de compras</a>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
